<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Maintenance — Ploutos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #101B3B;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .shape1 {
    position: fixed; top: -80px; right: -80px;
    width: 320px; height: 320px; border-radius: 50%;
    background: #E3AF64; opacity: 0.08;
  }
  .shape2 {
    position: fixed; bottom: -60px; left: -60px;
    width: 260px; height: 260px; border-radius: 50%;
    background: #26428B; opacity: 0.25;
  }
  .shape3 {
    position: fixed; top: 40%; left: -40px;
    width: 160px; height: 160px; border-radius: 20px;
    background: #E3AF64; opacity: 0.06; transform: rotate(25deg);
  }
  header {
    padding: 20px 40px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: relative; z-index: 1;
  }
  header img { height: 32px; width: auto; }
  .main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 40px 24px;
    position: relative; z-index: 1;
  }
  .logo-icon {
    width: 72px; height: 72px; margin-bottom: 32px;
    filter: drop-shadow(0 4px 16px rgba(227,175,100,0.3));
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(227,175,100,0.15);
    border: 1px solid rgba(227,175,100,0.35);
    border-radius: 100px; padding: 6px 16px;
    color: #E3AF64; font-size: 0.78rem; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    margin-bottom: 24px;
  }
  .badge-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #E3AF64;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  h1 {
    font-size: 2rem; font-weight: 600; color: #fff;
    margin-bottom: 16px; line-height: 1.2;
  }
  p {
    color: rgba(255,255,255,0.55); font-size: 0.95rem;
    line-height: 1.75; max-width: 420px; margin-bottom: 8px;
  }
  .eta {
    margin-top: 32px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; padding: 16px 28px;
    color: rgba(255,255,255,0.7); font-size: 0.88rem;
  }
  .eta strong { color: #E3AF64; }
  .contact {
    margin-top: 40px; font-size: 0.8rem;
    color: rgba(255,255,255,0.25);
  }
  .contact a {
    color: rgba(227,175,100,0.6); text-decoration: none;
    transition: color .2s;
  }
  .contact a:hover { color: #E3AF64; }
  footer {
    padding: 16px 40px; text-align: center;
    border-top: 1px solid rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.2); font-size: 0.75rem;
    position: relative; z-index: 1;
  }
</style>
</head>
